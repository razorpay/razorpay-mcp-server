version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - gosec
    - misspell
    - revive
    - interfacebloat
    - iface
    - gocritic
    - bodyclose
    - makezero
    - lll
  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 2
      min-occurrences: 2
    interfacebloat:
      max: 5
    iface:
      enable:
        - opaque
        - identical
    revive:
      rules:
        - name: blank-imports
          disabled: true
    lll:
      line-length: 80
      tab-width: 1

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/razorpay/razorpay-mcp-server

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
