service: razorpay-mcp-server  # required, canonical slug — immutable once registered
displayName: "Razorpay MCP Server"  # required, human-readable name — README H1 "# Razorpay MCP Server (Official)"
description: "Official Model Context Protocol server exposing Razorpay's public APIs — payments, orders, refunds, payment links, QR codes, settlements and OTP flows — as MCP tools for developers and AI tools, available as a Razorpay-hosted remote server or a locally run Go binary over stdio."  # required, one-sentence description — README (Quick Start's Remote vs Local options and the Available Tools table)
type: library  # required, one of: service | worker | cron | library | pipeline — this repo ships the distributable Go server (cmd/razorpay-mcp-server with stdio transport, goreleaser + docker-publish workflows) that developers run locally; no Spinnaker application, Netra deployment or alert rules exist for it. The hosted remote-MCP deployment is registered separately as razorpay-remote-mcp-server in the merged manifests — do not double-count it here · retype after the serviceTypes enum widens: tool
tier: T2  # required, one of: T0 | T1 | T2 | T3 — no priority column for this batch, judged from function: an official, externally distributed artifact that merchants install, so a bad release reaches outside the org (same reasoning as razorpay-cli, T2); it is a client-side tool with no paged runtime of its own, keeping it off T1
lifecycle: live  # optional — active (last push 2026-08-28) with published releases (goreleaser, docker-publish workflows, SECURITY.md/CONTRIBUTING.md in place); this is a shipped product artifact

domain: tech-infra/developer-productivity  # required, two-level domain/subgroup slug — family tech-infra from cache/miss_seed.json l1 (BU "Payments", csv_group "Tech Infra", EM ankit.choudhary); area reuses the tech-infra/developer-productivity slug already carried by the merged razorpay-remote-mcp-server manifest, which is this repo's hosted sibling under the same owner — keeping the pair together

owner:
