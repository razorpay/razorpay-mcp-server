name: Assign

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      # Start PMG in server mode to block malicious packages at install time
      - uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          # Please add your name to assignees
          script: |
            github.rest.issues.addAssignees({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              assignees: ['RZP7464','jating06','paraskathuria-dev','nikhil-rzp', 'ankitchoudhary2209']
            })

      # Enforce PMG policy and flush events to SafeDep Cloud
      - name: Stop proxy
        if: always()
        run: pmg proxy stop --fail-on-violation