name: PMG Smoke Test
# Verifies the SafeDep PMG integration works end-to-end: the proxy starts,
# intercepts a package install, blocks a known-malicious test package, and the
# fail-on-violation gate reports correctly.
#
# NOTE: this repo is a Go project and Go module fetches are NOT intercepted by
# PMG (PMG covers npm + PyPI). This smoke test therefore uses npm with SafeDep's
# benign known-malicious test package to prove the proxy + block path works on
# the runner. Run it manually from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pmg-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Start PMG in server mode (same config the real workflows use)
      - uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - name: Set up Node (provides npm for the block test)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Expect this to be BLOCKED by PMG. safedep-test-pkg is a benign package
      # flagged as malicious in SafeDep's DB for exactly this kind of test.
      # We invert the exit code: the step passes only if npm was blocked.
      - name: Verify PMG blocks a known-malicious package
        run: |
          if npm install --no-cache --prefer-online --no-save \
            safedep-test-pkg@0.1.3; then
            echo "::error::PMG did NOT block the malicious test package"
            exit 1
          else
            echo "PMG correctly blocked the malicious test package"
          fi

      # Enforce PMG policy and flush events to SafeDep Cloud
      - name: Stop proxy
        if: always()
        run: pmg proxy stop --fail-on-violation
