name: Build
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version-file: "go.mod"

      # Start PMG in server mode to block malicious packages at install time.
      # The safedep/pmg action supports Linux runners only, so gate it to
      # the ubuntu matrix leg (windows/macos legs would fail otherwise).
      - uses: safedep/pmg@v1
        if: runner.os == 'Linux'
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -race ./...

      - name: Build
        run: go build -v ./cmd/razorpay-mcp-server

      # Enforce PMG policy and flush events to SafeDep Cloud (Linux only)
      - name: Stop proxy
        if: always() && runner.os == 'Linux'
        run: pmg proxy stop --fail-on-violation