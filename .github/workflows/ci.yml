name: CI
on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run tests and publish test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      # Start PMG in server mode to block malicious packages at install time
      - uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - name: Run coverage
        run: |
         go test -race -covermode=atomic -coverprofile=coverage.out ./...    
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
           token: ${{ secrets.CODECOV_TOKEN }}
           files: ./coverage.out
           flags: unittests
           name: codecov-umbrella
           fail_ci_if_error: true
           verbose: true

      # Enforce PMG policy and flush events to SafeDep Cloud
      - name: Stop proxy
        if: always()
        run: pmg proxy stop --fail-on-violation
